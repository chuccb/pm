name: Markdown 文件檢查

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_markdown.py"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
    paths:
      - "**/*.md"
      - "scripts/check_markdown.py"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: 取得儲存庫
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Markdown 語言檢查相依套件
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented

      - name: 執行 Markdown 檢查
        run: python scripts/check_markdown.py
